[project]
name = "asha-vani"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhinav Mucharla", email = "abhinavmucharla27@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.18",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "supabase>=2.33.0",
]

[project.scripts]
asha-vani = "asha_vani:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
